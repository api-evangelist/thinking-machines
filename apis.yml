aid: thinking-machines
name: Thinking Machines
description: >-
  Thinking Machines Lab is an artificial intelligence research and product
  company building tools to make AI systems more widely understood,
  customizable, and generally capable. Its flagship developer product is
  Tinker, a managed API with an official Python SDK and CLI for fine-tuning and
  sampling open-weight language models (supervised fine-tuning, reinforcement
  learning, and distillation), alongside Inkling, an open-weights model. The
  Tinker platform exposes ServiceClient, TrainingClient, SamplingClient, and
  RestClient interfaces plus OpenAI- and Anthropic-compatible inference
  endpoints, governed by a project-scoped permission model.
